# Grafana поверх одного узла TSDB. Запуск из каталога docker/:
#   GRAFANA_ADMIN_PASSWORD=... docker compose -f docker-compose.yml -f docker-compose.grafana.yml up -d --build
# Grafana → Prometheus (исполняет PromQL) → remote read POST /api/v1/read → TSDB.
# loadgen сразу пишет 6 часов истории, затем точки в реальном времени.
#
# Наружу открыта только Grafana (GRAFANA_PORT, по умолчанию 3000). gRPC TSDB без авторизации,
# поэтому в этом режиме он слушает только 127.0.0.1; Prometheus и HTTP TSDB — только внутри сети compose.

services:
  tsdb:
    environment:
      TSDB_HTTP_PORT: "9201"
    ports: !override
      - "127.0.0.1:2222:2222"

  loadgen:
    image: tsdb-server:latest
    depends_on:
      tsdb:
        condition: service_healthy
    entrypoint: ["sh", "-c"]
    # повторный backfill после рестарта отклонится как out-of-order — это нормально, дальше реальное время
    command:
      - >-
        /cli/bin/tsdb-cli --addr tsdb:2222 load --series $${LOAD_SERIES} --duration 6h --fast
        && exec /cli/bin/tsdb-cli --addr tsdb:2222 load --series $${LOAD_SERIES} --duration 0
    environment:
      LOAD_SERIES: "${LOAD_SERIES:-40}"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.retention.time=1h
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - tsdb
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.3.0
    ports:
      - "${GRAFANA_PORT:-3000}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: "${GRAFANA_ADMIN_USER:-admin}"
      GF_SECURITY_ADMIN_PASSWORD: "${GRAFANA_ADMIN_PASSWORD:-admin}"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/tsdb.json
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus
    restart: unless-stopped

volumes:
  grafana-data:
